name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle :app:assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk NOVA-Treasure.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nova-treasure-apk
          path: NOVA-Treasure.apk
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1 >/dev/null 2>&1; then
            gh release create v0.1 --target "$GITHUB_SHA" --title "NOVA Treasure v0.1" --notes "Debug APK; public online map overlay."
          fi
          gh release upload v0.1 NOVA-Treasure.apk --clobber
